name: Build Android APKs (Player & Admin)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-player-apk:
    name: Build Dream11 Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Web Assets to Player App (Zero Admin)
        run: |
          python scripts/sync_assets.py
          echo "Player assets verified without admin files!"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Player APK with Gradle
        working-directory: android-player
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload Player APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dream11-Player-v1.0
          path: android-player/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-admin-apk:
    name: Build Dream11 Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Web Assets to Admin App (Admin Console Only)
        run: |
          python scripts/sync_assets.py
          echo "Admin assets verified!"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Admin APK with Gradle
        working-directory: android-admin
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dream11-Admin-v1.0
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
